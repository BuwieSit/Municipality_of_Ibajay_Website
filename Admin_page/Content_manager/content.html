<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../admin_styles/adminGlobalStyle.css">
    <link rel="stylesheet" href="./contentStyle.css">
    <link rel="stylesheet" href="../../global.css">

    <title>Ibajay Admin</title>
</head>
<body>

    <div class="member-content-container">

        <div class="add-news-wrapper">
            <form class="add-news-form">
                        <button class="add-buttons" id="addNewsBtn" type="submit"><img src="../../admin-resources/add.png">Add news</button>
            </form>

            <div class="admin-news-container">
                <div class="admin-news-item">
                    <div class="headline-image">
                        <img src="../../z-resources/news_thumb.png">
                        <div class="headline-image-wrapper">
                            <img src="../../admin-resources/edit.png" alt="edit">
                            <img src="../../admin-resources/preview.png" alt="prev">
                            <img src="../../admin-resources/delete.png" alt="del">
                        </div>
                    </div>
                    <h4 class="headline-title">This is the headliner</h4>
                </div>
            </div>
        </div>
        <div class="add-news-wrapper">
            <form class="add-news-form">
                    <button class="add-buttons" id="addNewsBtn" type="submit"><img src="../../admin-resources/add.png">Add announcement</button>
            </form>

            <table class="announce-list">
                <thead>
                    <tr>
                        <th>Headline</th>
                        <th>Description</th>
                        <th>Date Published</th>
                        <th>Date Updated</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td id="headline">The headliner</td>
                        <td id="description">Some description</td>
                        <td id="publishDate">2024-06-01</td>
                        <td id="updateDate">2024-06-17</td>
                        <td class="actions">
                            <img src="../../admin-resources/edit.png" alt="edit">
                            <img src="../../admin-resources/preview.png" alt="edit">
                            <img src="../../admin-resources/delete.png" alt="edit">

                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>


    <script src="../admin_styles/adminGlobalScript.js"></script>
    <script src="../admin_styles/adminAJAX.js"></script>
</body>
</html>
